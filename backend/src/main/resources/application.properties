# Server Port (Render sets the PORT environment variable)
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=nexus-gear-backend

# Database Configuration with seamless Fallback to H2 if PostgreSQL is not configured
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:nexusgeardb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA & Hibernate Settings
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Disabled in production by default)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Static Resources (Serves built frontend if packed in jar)
spring.web.resources.static-locations=classpath:/static/,classpath:/public/
